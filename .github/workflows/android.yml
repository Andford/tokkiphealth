name: Tokkip Health Android

# Builds the Android app (android/, a fork of SD Maid SE) when it changes: the
# release APK, signed with Tokkip's key from the secrets, then the unit tests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      TOKKIP_KEYSTORE_PASSWORD: ${{ secrets.TOKKIP_KEYSTORE_PASSWORD }}
      TOKKIP_KEY_ALIAS: ${{ secrets.TOKKIP_KEY_ALIAS || 'tokkip' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.TOKKIP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$TOKKIP_KEYSTORE_PASSWORD" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/tokkip.jks"
            echo "TOKKIP_KEYSTORE=$RUNNER_TEMP/tokkip.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable key."
          else
            echo "::warning::No TOKKIP_KEYSTORE_B64 / TOKKIP_KEYSTORE_PASSWORD secrets: this APK uses a throwaway key and will not install over a previous one."
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          fi

      - name: Build the APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E '^e: |ERROR:|What went wrong|Missing class|Error:' -A3 "$RUNNER_TEMP/build.log" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Name the APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk "../out/TokkipHealth-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tokkip-Health-Android
          path: out/*.apk
          retention-days: 7

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --continue --console=plain 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '^e: |FAILED|What went wrong' -A2 "$RUNNER_TEMP/test.log" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            echo "=== First lines of each failure (deepest cause) ==="
            for f in */build/test-results/*/*.xml; do
              grep -q '<failure' "$f" || continue
              echo "## $f"
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          seen = set()
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in tc.findall('failure'):
                  lines = (fl.text or '').splitlines()
                  causes = [l for l in lines if l.startswith('Caused by') or (l and not l.startswith('\t') and not l.startswith(' '))]
                  key = causes[-1] if causes else lines[0]
                  if key in seen: continue
                  seen.add(key)
                  print(tc.get('name')); print('\n'.join(lines[:3])); print('\n'.join(causes[-2:])); print('---')
          PY
            done
            exit 1
          }
